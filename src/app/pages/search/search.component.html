<app-breadcrumb/>
@if (total() > 0) {
  <div [class.post-list]="!isMobile" [class.m-post-list]="isMobile">
    @for (item of searchResult(); track item.id; let i = $index) {
      <app-post-item [post]="item" [index]="i" [fromSection]="false"/>
    }
  </div>
} @else {
  <div class="empty" [class.p-empty]="!isMobile" [class.m-empty]="isMobile">
    <nz-empty nzNotFoundImage="simple"/>
  </div>
}
<app-make-money></app-make-money>
<app-pagination [page]="page()"
                [total]="total()"
                [pageSize]="pageSize()"
                [url]="paginationUrl"
                [params]="paginationParams()"/>
