<app-breadcrumb></app-breadcrumb>
@if (total() > 0) {
  <div [class.post-list]="!isMobile" [class.m-post-list]="isMobile">
    @for (post of posts(); track post.id; let i = $index) {
      <app-post-item [post]="post" [index]="i" [fromSection]="isSection()"></app-post-item>
    }
  </div>
} @else {
  <div class="empty" [class.p-empty]="!isMobile" [class.m-empty]="isMobile">
    <nz-empty nzNotFoundImage="simple"></nz-empty>
  </div>
}
<app-make-money></app-make-money>
<app-pagination [page]="page()" [total]="total()" [pageSize]="pageSize()" [url]="paginationUrl()"></app-pagination>
